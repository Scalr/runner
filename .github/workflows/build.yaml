name: Build Runner Images

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
      - opened
      - ready_for_review
      - reopened
      - synchronize

jobs:
  build:
    name: Build and Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    # Both distro families are built in parallel; a failure in one does not
    # cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: scalr/runner
          - distro: ubuntu
            image: scalr/runner-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build all variants single-arch so they can be loaded locally and smoke-tested.
      - name: Build images
        uses: docker/bake-action@v5
        with:
          files: |
            docker-bake.hcl
            versions.json
          targets: ${{ matrix.distro }}
          load: true
          # Use GitHub Actions cache (type=gha) — scoped per target, lives in
          # GitHub's per-repo cache backend, not the public Docker Hub repo.
          set: |
            *.platform=linux/amd64
            ${{ matrix.distro }}-full.tags=${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.distro }}-python39.tags=${{ matrix.image }}:sha-${{ github.sha }}-python39
            ${{ matrix.distro }}-slim.tags=${{ matrix.image }}:sha-${{ github.sha }}-slim
            ${{ matrix.distro }}-full.cache-from=type=gha,scope=${{ matrix.distro }}-full
            ${{ matrix.distro }}-full.cache-to=type=gha,scope=${{ matrix.distro }}-full,mode=max
            ${{ matrix.distro }}-python39.cache-from=type=gha,scope=${{ matrix.distro }}-python39
            ${{ matrix.distro }}-python39.cache-to=type=gha,scope=${{ matrix.distro }}-python39,mode=max
            ${{ matrix.distro }}-slim.cache-from=type=gha,scope=${{ matrix.distro }}-slim
            ${{ matrix.distro }}-slim.cache-to=type=gha,scope=${{ matrix.distro }}-slim,mode=max

      - name: Test full image
        env:
          IMAGE: ${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          docker run --rm "$IMAGE" -xc 'gcloud version'
          docker run --rm "$IMAGE" -xc 'aws --version'
          docker run --rm "$IMAGE" -xc 'az --version'
          docker run --rm "$IMAGE" -xc 'kubectl version --client'
          docker run --rm "$IMAGE" -xc 'scalr -version'
          docker run --rm "$IMAGE" -xc 'python --version'
          docker run --rm "$IMAGE" -xc 'pip --version'
          docker run --rm "$IMAGE" -xc 'pip install requests'

      - name: Test python39 image
        env:
          IMAGE: ${{ matrix.image }}:sha-${{ github.sha }}-python39
        run: |
          docker run --rm "$IMAGE" -xc 'python --version'
          docker run --rm "$IMAGE" -xc 'pip --version'
          docker run --rm "$IMAGE" -xc 'pip install requests'

      - name: Test slim image
        env:
          IMAGE: ${{ matrix.image }}:sha-${{ github.sha }}-slim
        run: |
          docker run --rm "$IMAGE" -xc 'git --version'
          docker run --rm "$IMAGE" -xc 'curl --version'
          docker run --rm "$IMAGE" -xc 'jq --version'
          # Confirm python and cloud tools are absent.
          docker run --rm "$IMAGE" -xc '! command -v python'
          docker run --rm "$IMAGE" -xc '! command -v aws'
