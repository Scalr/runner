name: Release Runner Image
run-name: Release ${{ inputs.version }} ${{ inputs.correlation_id }}

# Run on main after the PR that dates the CHANGELOG section merges. The workflow tags
# the commit it runs on, so the tag and the images always come from the same commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Runner version without a `v` prefix (e.g. `0.6.5`).
        required: true
        type: string
      correlation_id:
        description: Set by the release-management orchestrator to find this run.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check and Tag
    runs-on: ubuntu-latest
    permissions:
      # Push the release tag.
      contents: write
    steps:
      - name: Check Ref and Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the workflow on main, got ${GITHUB_REF}"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z without a v prefix, got '${VERSION}'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          heading=$(grep -m1 '^## \[' CHANGELOG.md || true)
          prefix="## [${VERSION}](https://github.com/Scalr/runner/tree/${VERSION}) ("
          if [[ "$heading" != "$prefix"* ]]; then
            echo "::error::The top CHANGELOG section must be ${VERSION}, got '${heading}'"
            exit 1
          fi

          release_date="${heading#"$prefix"}"
          release_date="${release_date%)}"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::The ${VERSION} section has no release date, got '${release_date}'. Merge a PR that replaces Unreleased with the date first."
            exit 1
          fi

          section=$(awk '/^## \[/ { n++ } n == 1' CHANGELOG.md)
          compare=$(grep -m1 -oE '^\[Full Changelog\]\(https://github\.com/Scalr/runner/compare/[^)]+\)$' <<< "$section" || true)
          previous=$(sed -nE "s|^\[Full Changelog\]\(https://github\.com/Scalr/runner/compare/([0-9]+\.[0-9]+\.[0-9]+)\.\.\.${VERSION//./\\.}\)$|\1|p" <<< "$compare")
          if [[ -z "$previous" ]]; then
            echo "::error::The ${VERSION} section must end with a compare link <previous>...${VERSION}, got '${compare}'"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${previous}" > /dev/null; then
            echo "::error::The compare link starts at ${previous}, but this tag does not exist"
            exit 1
          fi
          echo "CHANGELOG ${VERSION} (${release_date}), compare from ${previous}"

      # A re-run after a failed build finds the tag on the same commit and continues
      - name: Create and Push Tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if remote_sha=$(git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" | cut -f1); then
            if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
              echo "Tag ${VERSION} already points to ${GITHUB_SHA}"
              exit 0
            fi
            echo "::error::Tag ${VERSION} already exists on ${remote_sha}"
            exit 1
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"

  build:
    name: Build and Push
    needs: [tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by google-github-actions/auth for workload identity federation.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Authenticate to Google Artifact Registry (GAR) so the same build can be
      # mirrored to the internal Scalr registry alongside Docker Hub.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{vars.GOOGLE_WORKLOAD_IDENTITY_POOL_PROVIDER}}
          service_account: ${{vars.GOOGLE_SERVICE_ACCOUNT_EMAIL}}
          token_format: access_token

      - name: Login to GAR (EU dev)
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.EU_DEV_MIRROR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to GAR (EU stage)
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.EU_STAGE_MIRROR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to GAR (US prod)
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.US_PROD_MIRROR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Older buildx accepts `--set *.no-cache-filter` but ignores it.
          version: v0.38.1

      - name: Format image tag
        id: image_tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "tag=${VERSION}" | tee -a $GITHUB_OUTPUT

      # Three GAR mirrors — EU dev, EU stage and US production.
      - name: Compose GAR image paths
        id: gar
        run: |
          echo "image_eu_dev=${{ vars.EU_DEV_MIRROR_LOCATION }}-docker.pkg.dev/${{ vars.EU_DEV_GOOGLE_PROJECT }}/main/scalr/runner" | tee -a $GITHUB_OUTPUT
          echo "image_eu_stage=${{ vars.EU_STAGE_MIRROR_LOCATION }}-docker.pkg.dev/${{ vars.EU_STAGE_GOOGLE_PROJECT }}/main/scalr/runner" | tee -a $GITHUB_OUTPUT
          echo "image_us_prod=${{ vars.US_PROD_MIRROR_LOCATION }}-docker.pkg.dev/${{ vars.US_PROD_GOOGLE_PROJECT }}/main/scalr/runner" | tee -a $GITHUB_OUTPUT

      - name: Build and push images
        uses: docker/bake-action@v5
        env:
          VERSION: ${{ steps.image_tag.outputs.tag }}
        with:
          files: |
            docker-bake.hcl
            versions.json
          push: true
          # Append all GAR mirror tags to each target so a single push writes
          # to Docker Hub (declared in docker-bake.hcl) and every GAR mirror.
          # All GAR mirrors additionally get a `v`-prefixed alias
          # (e.g. `v0.4.2`) so GAR cleanup policies can filter release tags
          # by prefix. Cache uses GitHub Actions cache (per-repo, private) so
          # nothing cache-related leaks into the public Docker Hub repo.
          # base-slim always rebuilds: its apt packages are not pinned, so a cached
          # layer would ship the Debian security updates of an older build.
          set: |
            full.tags+=${{ steps.gar.outputs.image_eu_dev }}:${{ steps.image_tag.outputs.tag }}
            full.tags+=${{ steps.gar.outputs.image_eu_dev }}:v${{ steps.image_tag.outputs.tag }}
            full.tags+=${{ steps.gar.outputs.image_eu_stage }}:${{ steps.image_tag.outputs.tag }}
            full.tags+=${{ steps.gar.outputs.image_eu_stage }}:v${{ steps.image_tag.outputs.tag }}
            full.tags+=${{ steps.gar.outputs.image_us_prod }}:${{ steps.image_tag.outputs.tag }}
            full.tags+=${{ steps.gar.outputs.image_us_prod }}:v${{ steps.image_tag.outputs.tag }}
            python39.tags+=${{ steps.gar.outputs.image_eu_dev }}:${{ steps.image_tag.outputs.tag }}-python39
            python39.tags+=${{ steps.gar.outputs.image_eu_dev }}:v${{ steps.image_tag.outputs.tag }}-python39
            python39.tags+=${{ steps.gar.outputs.image_eu_stage }}:${{ steps.image_tag.outputs.tag }}-python39
            python39.tags+=${{ steps.gar.outputs.image_eu_stage }}:v${{ steps.image_tag.outputs.tag }}-python39
            python39.tags+=${{ steps.gar.outputs.image_us_prod }}:${{ steps.image_tag.outputs.tag }}-python39
            python39.tags+=${{ steps.gar.outputs.image_us_prod }}:v${{ steps.image_tag.outputs.tag }}-python39
            slim.tags+=${{ steps.gar.outputs.image_eu_dev }}:${{ steps.image_tag.outputs.tag }}-slim
            slim.tags+=${{ steps.gar.outputs.image_eu_dev }}:v${{ steps.image_tag.outputs.tag }}-slim
            slim.tags+=${{ steps.gar.outputs.image_eu_stage }}:${{ steps.image_tag.outputs.tag }}-slim
            slim.tags+=${{ steps.gar.outputs.image_eu_stage }}:v${{ steps.image_tag.outputs.tag }}-slim
            slim.tags+=${{ steps.gar.outputs.image_us_prod }}:${{ steps.image_tag.outputs.tag }}-slim
            slim.tags+=${{ steps.gar.outputs.image_us_prod }}:v${{ steps.image_tag.outputs.tag }}-slim
            full.cache-from=type=gha,scope=full
            full.cache-to=type=gha,scope=full,mode=max
            python39.cache-from=type=gha,scope=python39
            python39.cache-to=type=gha,scope=python39,mode=max
            slim.cache-from=type=gha,scope=slim
            slim.cache-to=type=gha,scope=slim,mode=max
            *.no-cache-filter=base-slim

      - name: Report published images
        env:
          TAG: ${{ steps.image_tag.outputs.tag }}
          IMG_EU_DEV: ${{ steps.gar.outputs.image_eu_dev }}
          IMG_EU_STAGE: ${{ steps.gar.outputs.image_eu_stage }}
          IMG_US_PROD: ${{ steps.gar.outputs.image_us_prod }}
        run: |
          echo "Published runner images for release ${TAG}"
          echo ""
          echo "Docker Hub:"
          echo "  scalr/runner:${TAG}"
          echo "  scalr/runner:${TAG}-python39"
          echo "  scalr/runner:${TAG}-slim"
          echo ""
          echo "GAR — EU dev:"
          echo "  ${IMG_EU_DEV}:${TAG}"
          echo "  ${IMG_EU_DEV}:${TAG}-python39"
          echo "  ${IMG_EU_DEV}:${TAG}-slim"
          echo "  ${IMG_EU_DEV}:v${TAG}"
          echo "  ${IMG_EU_DEV}:v${TAG}-python39"
          echo "  ${IMG_EU_DEV}:v${TAG}-slim"
          echo ""
          echo "GAR — EU stage:"
          echo "  ${IMG_EU_STAGE}:${TAG}"
          echo "  ${IMG_EU_STAGE}:${TAG}-python39"
          echo "  ${IMG_EU_STAGE}:${TAG}-slim"
          echo "  ${IMG_EU_STAGE}:v${TAG}"
          echo "  ${IMG_EU_STAGE}:v${TAG}-python39"
          echo "  ${IMG_EU_STAGE}:v${TAG}-slim"
          echo ""
          echo "GAR — US prod:"
          echo "  ${IMG_US_PROD}:${TAG}"
          echo "  ${IMG_US_PROD}:${TAG}-python39"
          echo "  ${IMG_US_PROD}:${TAG}-slim"
          echo "  ${IMG_US_PROD}:v${TAG}"
          echo "  ${IMG_US_PROD}:v${TAG}-python39"
          echo "  ${IMG_US_PROD}:v${TAG}-slim"
          {
            echo "## Published runner images — \`${TAG}\`"
            echo ""
            echo "**Docker Hub**"
            echo ""
            echo "- \`scalr/runner:${TAG}\`"
            echo "- \`scalr/runner:${TAG}-python39\`"
            echo "- \`scalr/runner:${TAG}-slim\`"
            echo ""
            echo "**GAR — EU dev**"
            echo ""
            echo "- \`${IMG_EU_DEV}:${TAG}\`"
            echo "- \`${IMG_EU_DEV}:${TAG}-python39\`"
            echo "- \`${IMG_EU_DEV}:${TAG}-slim\`"
            echo "- \`${IMG_EU_DEV}:v${TAG}\`"
            echo "- \`${IMG_EU_DEV}:v${TAG}-python39\`"
            echo "- \`${IMG_EU_DEV}:v${TAG}-slim\`"
            echo ""
            echo "**GAR — EU stage**"
            echo ""
            echo "- \`${IMG_EU_STAGE}:${TAG}\`"
            echo "- \`${IMG_EU_STAGE}:${TAG}-python39\`"
            echo "- \`${IMG_EU_STAGE}:${TAG}-slim\`"
            echo "- \`${IMG_EU_STAGE}:v${TAG}\`"
            echo "- \`${IMG_EU_STAGE}:v${TAG}-python39\`"
            echo "- \`${IMG_EU_STAGE}:v${TAG}-slim\`"
            echo ""
            echo "**GAR — US prod**"
            echo ""
            echo "- \`${IMG_US_PROD}:${TAG}\`"
            echo "- \`${IMG_US_PROD}:${TAG}-python39\`"
            echo "- \`${IMG_US_PROD}:${TAG}-slim\`"
            echo "- \`${IMG_US_PROD}:v${TAG}\`"
            echo "- \`${IMG_US_PROD}:v${TAG}-python39\`"
            echo "- \`${IMG_US_PROD}:v${TAG}-slim\`"
          } >> "$GITHUB_STEP_SUMMARY"
