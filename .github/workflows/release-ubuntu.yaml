name: Release Runner Image (Ubuntu)

# Triggered by tags of the form `ubuntu/<x.y.z>`, e.g. `ubuntu/0.5.0`.
# The distro prefix is stripped before it is used as the image tag, so
# `ubuntu/0.5.0` publishes `scalr/runner-ubuntu:0.5.0`. The Debian family is
# released independently by release-debian.yaml.

on:
  push:
    tags:
      - "ubuntu/*.*.*"

permissions:
  # Needed by the update_changelog job to git-push CHANGELOG.md back to main.
  contents: write
  # Required by google-github-actions/auth for workload identity federation.
  id-token: write

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Authenticate to Google Artifact Registry (GAR) so the same build can be
      # mirrored to the internal Scalr registry alongside Docker Hub.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{vars.GOOGLE_WORKLOAD_IDENTITY_POOL_PROVIDER}}
          service_account: ${{vars.GOOGLE_SERVICE_ACCOUNT_EMAIL}}
          token_format: access_token

      - name: Login to GAR (EU dev)
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.EU_DEV_MIRROR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to GAR (US prod)
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.US_PROD_MIRROR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `refs/tags/ubuntu/0.5.0` -> `0.5.0`
      - name: Format Image Tag
        id: image_tag
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          echo "tag=${ref#ubuntu/}" | tee -a $GITHUB_OUTPUT

      # Two regional GAR mirrors — EU dev and US production.
      - name: Compose GAR image paths
        id: gar
        run: |
          echo "image_eu=${{ vars.EU_DEV_MIRROR_LOCATION }}-docker.pkg.dev/${{ vars.EU_DEV_GOOGLE_PROJECT }}/main/scalr/runner-ubuntu" | tee -a $GITHUB_OUTPUT
          echo "image_us=${{ vars.US_PROD_MIRROR_LOCATION }}-docker.pkg.dev/${{ vars.US_PROD_GOOGLE_PROJECT }}/main/scalr/runner-ubuntu" | tee -a $GITHUB_OUTPUT

      - name: Build and push images
        uses: docker/bake-action@v5
        env:
          VERSION: ${{ steps.image_tag.outputs.tag }}
        with:
          files: |
            docker-bake.hcl
            versions.json
          targets: ubuntu
          push: true
          # Append both GAR region tags to each target so a single push writes
          # to Docker Hub (declared in docker-bake.hcl) and both regional GAR
          # mirrors. Cache uses GitHub Actions cache (per-repo, private) so
          # nothing cache-related leaks into the public Docker Hub repo.
          set: |
            ubuntu-full.tags+=${{ steps.gar.outputs.image_eu }}:${{ steps.image_tag.outputs.tag }}
            ubuntu-full.tags+=${{ steps.gar.outputs.image_us }}:${{ steps.image_tag.outputs.tag }}
            ubuntu-python39.tags+=${{ steps.gar.outputs.image_eu }}:${{ steps.image_tag.outputs.tag }}-python39
            ubuntu-python39.tags+=${{ steps.gar.outputs.image_us }}:${{ steps.image_tag.outputs.tag }}-python39
            ubuntu-slim.tags+=${{ steps.gar.outputs.image_eu }}:${{ steps.image_tag.outputs.tag }}-slim
            ubuntu-slim.tags+=${{ steps.gar.outputs.image_us }}:${{ steps.image_tag.outputs.tag }}-slim
            ubuntu-full.cache-from=type=gha,scope=ubuntu-full
            ubuntu-full.cache-to=type=gha,scope=ubuntu-full,mode=max
            ubuntu-python39.cache-from=type=gha,scope=ubuntu-python39
            ubuntu-python39.cache-to=type=gha,scope=ubuntu-python39,mode=max
            ubuntu-slim.cache-from=type=gha,scope=ubuntu-slim
            ubuntu-slim.cache-to=type=gha,scope=ubuntu-slim,mode=max

      - name: Report published images
        env:
          TAG: ${{ steps.image_tag.outputs.tag }}
          IMG_EU: ${{ steps.gar.outputs.image_eu }}
          IMG_US: ${{ steps.gar.outputs.image_us }}
        run: |
          echo "Published Ubuntu runner images for release ${TAG}"
          echo ""
          echo "Docker Hub:"
          echo "  scalr/runner-ubuntu:${TAG}"
          echo "  scalr/runner-ubuntu:${TAG}-python39"
          echo "  scalr/runner-ubuntu:${TAG}-slim"
          echo ""
          echo "GAR — EU dev:"
          echo "  ${IMG_EU}:${TAG}"
          echo "  ${IMG_EU}:${TAG}-python39"
          echo "  ${IMG_EU}:${TAG}-slim"
          echo ""
          echo "GAR — US prod:"
          echo "  ${IMG_US}:${TAG}"
          echo "  ${IMG_US}:${TAG}-python39"
          echo "  ${IMG_US}:${TAG}-slim"
          {
            echo "## Published Ubuntu runner images — \`${TAG}\`"
            echo ""
            echo "**Docker Hub**"
            echo ""
            echo "- \`scalr/runner-ubuntu:${TAG}\`"
            echo "- \`scalr/runner-ubuntu:${TAG}-python39\`"
            echo "- \`scalr/runner-ubuntu:${TAG}-slim\`"
            echo ""
            echo "**GAR — EU dev**"
            echo ""
            echo "- \`${IMG_EU}:${TAG}\`"
            echo "- \`${IMG_EU}:${TAG}-python39\`"
            echo "- \`${IMG_EU}:${TAG}-slim\`"
            echo ""
            echo "**GAR — US prod**"
            echo ""
            echo "- \`${IMG_US}:${TAG}\`"
            echo "- \`${IMG_US}:${TAG}-python39\`"
            echo "- \`${IMG_US}:${TAG}-slim\`"
          } >> "$GITHUB_STEP_SUMMARY"